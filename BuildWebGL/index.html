<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Codex (In Progress) 1</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1920 height=1080></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Codex (In Progress) 1</div>
        </div>
    </div>
    
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://bpjyqsfggliwehnqcbhy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwanlxc2ZnZ2xpd2VobnFjYmh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3OTQ4MjksImV4cCI6MjA3MDM3MDgyOX0.0Kfae4pN-paqxcRAycmQIhuAHrGZe2gs6xTKoAy7-5c';
        
        var supabaseClient = null;
        var unityInstance = null;
        
        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('Supabase library not loaded yet!');
                return false;
            }
            
            if (supabaseClient === null) {
                try {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    console.log('Supabase client initialized successfully');
                    return true;
                } catch (error) {
                    console.error('Failed to initialize Supabase:', error);
                    return false;
                }
            }
            return true;
        }
        
        window.addEventListener('load', function() {
            setTimeout(initSupabase, 100);
        });
        
        // Helper function to send messages to Unity
        function SendMessageToUnity(objectName, methodName, message) {
            if (unityInstance) {
                unityInstance.SendMessage(objectName, methodName, message || '');
            }
        }

        // =====================
        // Authentication Functions
        // =====================
        window.SupabaseRegister = async function(email, password) {
            if (!initSupabase()) {
                console.error('Supabase not initialized for registration');
                SendMessageToUnity('AuthManager', 'OnRegisterError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (error) throw error;
                
                console.log('Registration successful:', data);
                
                if (data.user) {
                    const username = localStorage.getItem('pendingUsername') || 'Player';
                    
                    try {
                        const { data: playerData, error: createError } = await supabaseClient
                            .from('player_data')
                            .insert({
                                user_id: data.user.id,
                                email: email,
                                username: username,
                                levels_unlocked: 5,
                                current_money: 0,
                                unlocked_cosmetics: '[]'
                            })
                            .select()
                            .single();
                        
                        if (!createError && playerData) {
                            console.log('Player data auto-created on registration:', playerData);
                            SendMessageToUnity('PlayerDataManager', 'OnPlayerDataCreated', JSON.stringify(playerData));
                        }
                        
                        localStorage.removeItem('pendingUsername');
                    } catch (createError) {
                        console.warn('Could not auto-create player data:', createError);
                    }
                }
                
                SendMessageToUnity('AuthManager', 'OnRegisterSuccess', JSON.stringify(data));
            } catch (error) {
                console.error('Registration error:', error);
                SendMessageToUnity('AuthManager', 'OnRegisterError', error.message);
            }
        };

        window.SupabaseLogin = async function(email, password) {
            if (!initSupabase()) {
                console.error('Supabase not initialized for login');
                SendMessageToUnity('AuthManager', 'OnLoginError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) throw error;
                
                console.log('Login successful:', data);
                
                if (data.user) {
                    try {
                        const { data: playerData, error: playerError } = await supabaseClient
                            .from('player_data')
                            .select('*')
                            .eq('user_id', data.user.id)
                            .single();
                        
                        if (!playerError && playerData) {
                            console.log('Player data auto-loaded on login:', playerData);
                            SendMessageToUnity('PlayerDataManager', 'OnPlayerDataLoaded', JSON.stringify(playerData));
                        }
                    } catch (playerLoadError) {
                        console.warn('Could not auto-load player data:', playerLoadError);
                    }
                }
                
                SendMessageToUnity('AuthManager', 'OnLoginSuccess', JSON.stringify(data));
            } catch (error) {
                console.error('Login error:', error);
                SendMessageToUnity('AuthManager', 'OnLoginError', error.message);
            }
        };

        window.SupabaseLogout = async function() {
            if (!initSupabase()) {
                console.error('Supabase not initialized for logout');
                SendMessageToUnity('AuthManager', 'OnLogoutError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { error } = await supabaseClient.auth.signOut();
                
                if (error) throw error;
                
                console.log('Logout successful - Supabase session cleared');
                SendMessageToUnity('AuthManager', 'OnLogoutSuccess', '');
            } catch (error) {
                console.error('Logout error:', error);
                SendMessageToUnity('AuthManager', 'OnLogoutError', error.message);
            }
        };

        // =====================
        // Player Data Functions
        // =====================
        window.createPlayerData = async function(userId, email, username) {
            if (!initSupabase()) {
                console.error('Supabase not initialized for createPlayerData');
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { data, error } = await supabaseClient
                    .from('player_data')
                    .insert({
                        user_id: userId,
                        email: email,
                        username: username,
                        levels_unlocked: 5,
                        current_money: 0,
                        unlocked_cosmetics: '[]'
                    })
                    .select()
                    .single();
                
                if (error) throw error;
                
                console.log('Player data created:', data);
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataCreated', JSON.stringify(data));
            } catch (error) {
                console.error('Create player data error:', error);
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataError', error.message);
            }
        };

        window.loadPlayerData = async function(userId) {
            if (!initSupabase()) {
                console.error('Supabase not initialized for loadPlayerData');
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { data, error } = await supabaseClient
                    .from('player_data')
                    .select('*')
                    .eq('user_id', userId)
                    .single();
                
                if (error) throw error;
                
                console.log('Player data loaded:', data);
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataLoaded', JSON.stringify(data));
            } catch (error) {
                console.error('Load player data error:', error);
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataError', error.message);
            }
        };

        window.updatePlayerData = async function(userId, levelsUnlocked, currentMoney, unlockedCosmetics) {
            if (!initSupabase()) {
                console.error('Supabase not initialized for updatePlayerData');
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { data, error } = await supabaseClient
                    .from('player_data')
                    .update({
                        levels_unlocked: parseInt(levelsUnlocked),
                        current_money: parseInt(currentMoney),
                        unlocked_cosmetics: unlockedCosmetics,
                        updated_at: new Date().toISOString()
                    })
                    .eq('user_id', userId)
                    .select()
                    .single();
                
                if (error) throw error;
                
                console.log('Player data updated:', data);
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataUpdated', JSON.stringify(data));
            } catch (error) {
                console.error('Update player data error:', error);
                SendMessageToUnity('PlayerDataManager', 'OnPlayerDataError', error.message);
            }
        };

        window.getCurrentUser = async function() {
            if (!initSupabase()) {
                console.error('Supabase not initialized for getCurrentUser');
                SendMessageToUnity('AuthManager', 'OnGetUserError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (user) {
                    console.log('Current user:', user);
                    SendMessageToUnity('AuthManager', 'OnGetUserSuccess', JSON.stringify(user));
                } else {
                    SendMessageToUnity('AuthManager', 'OnGetUserError', 'No user logged in');
                }
            } catch (error) {
                console.error('Get current user error:', error);
                SendMessageToUnity('AuthManager', 'OnGetUserError', error.message);
            }
        };

        // =====================
        // Game Save Functions (NEW)
        // =====================
        
        window.LoadAllSaveSlotsJS = async function() {
            if (!initSupabase()) {
                console.error('Supabase not initialized for LoadAllSaveSlotsJS');
                SendMessageToUnity('NewAndLoadGameManager', 'OnSaveSlotError', 'Supabase not initialized');
                return;
            }
            
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (!user) {
                    console.log('No user logged in, skipping cloud load');
                    SendMessageToUnity('NewAndLoadGameManager', 'OnAllSaveSlotsLoaded', '[]');
                    return;
                }
                
                const { data, error } = await supabaseClient
                    .from('game_saves')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('slot_number', { ascending: true });
                
                if (error) throw error;
                
                console.log('All save slots loaded:', data);
                SendMessageToUnity('NewAndLoadGameManager', 'OnAllSaveSlotsLoaded', JSON.stringify(data || []));
            } catch (error) {
                console.error('Load all save slots error:', error);
                SendMessageToUnity('NewAndLoadGameManager', 'OnSaveSlotError', error.message);
            }
        };

        window.SaveSlotToSupabaseJS = async function(slotNumber, username, levelsUnlocked, currentMoney, unlockedCosmetics) {
            if (!initSupabase()) {
                console.error('Supabase not initialized for SaveSlotToSupabaseJS');
                return;
            }
            
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (!user) {
                    console.log('No user logged in, skipping cloud save');
                    return;
                }
                
                const saveData = {
                    user_id: user.id,
                    slot_number: slotNumber,
                    username: username,
                    levels_unlocked: levelsUnlocked,
                    current_money: currentMoney,
                    unlocked_cosmetics: unlockedCosmetics,
                    last_played: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                const { data, error } = await supabaseClient
                    .from('game_saves')
                    .upsert(saveData, {
                        onConflict: 'user_id,slot_number'
                    })
                    .select()
                    .single();
                
                if (error) throw error;
                
                console.log('Save slot saved to Supabase:', data);
                SendMessageToUnity('NewAndLoadGameManager', 'OnSaveSlotSaved', JSON.stringify(data));
            } catch (error) {
                console.error('Save slot error:', error);
                SendMessageToUnity('NewAndLoadGameManager', 'OnSaveSlotError', error.message);
            }
        };

        window.DeleteSlotFromSupabaseJS = async function(slotNumber) {
            if (!initSupabase()) {
                console.error('Supabase not initialized for DeleteSlotFromSupabaseJS');
                return;
            }
            
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (!user) {
                    console.log('No user logged in, skipping cloud delete');
                    return;
                }
                
                const { error } = await supabaseClient
                    .from('game_saves')
                    .delete()
                    .eq('user_id', user.id)
                    .eq('slot_number', slotNumber);
                
                if (error) throw error;
                
                console.log('Save slot deleted from Supabase:', slotNumber);
                SendMessageToUnity('NewAndLoadGameManager', 'OnSaveSlotDeleted', slotNumber.toString());
            } catch (error) {
                console.error('Delete slot error:', error);
                SendMessageToUnity('NewAndLoadGameManager', 'OnSaveSlotError', error.message);
            }
        };

        // =====================
        // Unity WebGL Loader
        // =====================
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/BuildWebGL.loader.js";
        var config = {
            dataUrl: buildUrl + "/BuildWebGL.data.br",
            frameworkUrl: buildUrl + "/BuildWebGL.framework.js.br",
            codeUrl: buildUrl + "/BuildWebGL.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Codex (In Progress) 1",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1;
        } else {
            canvas.style.width = "1920px";
            canvas.style.height = "1080px";
        }
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((instance) => {
                unityInstance = instance;
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
